name: Python tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "install/**"
      - "hooks/**"
      - "templates/**"
      - "tests/**"
      - "tools/**"
      - "core/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CHANGELOG.md"
      - "hosts/claude/**"
      - "hosts/codex/**"
      - "hosts/agy/**"
      - "hosts/grok/**"
      - "hosts/opencode/**"
      - "prompts/**"
      - "docs/README.*.md"
      - "docs/specs/dispatch-verification/**"
      - "docs/specs/prompt-document-lock/**"
      - ".github/workflows/python-tests.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "install/**"
      - "hooks/**"
      - "templates/**"
      - "tests/**"
      - "tools/**"
      - "core/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "README.md"
      - "CHANGELOG.md"
      - "hosts/claude/**"
      - "hosts/codex/**"
      - "hosts/agy/**"
      - "hosts/grok/**"
      - "hosts/opencode/**"
      - "prompts/**"
      - "docs/README.*.md"
      - "docs/specs/dispatch-verification/**"
      - "docs/specs/prompt-document-lock/**"
      - ".github/workflows/python-tests.yml"
  # tag 與 nightly 不套 paths：版本發佈前與每天都完整跑一次三平台。
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

# 同一個 PR 的新 push 取消舊的 run；push main / tag / nightly 不取消，
# 否則 lock 檢查與完整三平台驗證可能被後來的 run 吃掉。
concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python 3.11 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # 測試數量增加後 Windows runner 約需 4 到 6 分鐘，5 分鐘會在測試途中被取消。
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 輸出與 render 結果不同時直接指名檔案；不到 5 秒，先於整套測試之外單獨報錯。
      - name: Render check for all hosts
        shell: bash
        run: |
          for host in claude codex agy grok opencode claude-plugin; do
            python tools/render.py --host "${host}" --check
          done

      # PR：ubuntu 跑完整套件，macOS / Windows 只跑跨平台敏感子集（清單集中在
      # tests/ci_cross_platform.txt）。push main、tag、nightly 三平台都跑完整套件。
      - name: Run unit tests (full)
        if: matrix.os == 'ubuntu-latest' || github.event_name != 'pull_request'
        run: python -m unittest discover -s tests -v

      - name: Run unit tests (cross-platform subset)
        if: matrix.os != 'ubuntu-latest' && github.event_name == 'pull_request'
        shell: bash
        env:
          PYTHONPATH: tests
        run: python -m unittest -v $(grep -v '^#' tests/ci_cross_platform.txt | tr -d '\r')

      - name: Entrypoint dry-run for all hosts (temp HOME)
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          home = tempfile.mkdtemp(prefix="shoal-ci-home-")
          env = dict(os.environ, HOME=home, USERPROFILE=home)
          for key, sub in (("XDG_DATA_HOME", "data"), ("XDG_STATE_HOME", "state"), ("CODEX_HOME", "codex"),
                           ("GROK_HOME", "grok"), ("OPENCODE_CONFIG_DIR", "opencode"), ("CLAUDE_CONFIG_DIR", "claude")):
              env[key] = os.path.join(home, sub)
          os.makedirs(env["OPENCODE_CONFIG_DIR"])
          failed = []
          for host in ("claude", "codex", "grok", "opencode", "agy"):
              print("::group::" + host, flush=True)
              code = subprocess.run([sys.executable, "tools/shoal_install.py", "--host", host], env=env).returncode
              print("::endgroup::", flush=True)
              if code != 0:
                  failed.append(host)
          print("::group::update", flush=True)
          if subprocess.run([sys.executable, "tools/shoal_install.py", "--update"], env=env).returncode != 0:
              failed.append("update")
          print("::endgroup::", flush=True)
          sys.exit("dry-run failed: " + ", ".join(failed) if failed else 0)

      - name: Check Python syntax
        run: python -m py_compile tools/shoal_install.py tools/shoal_update.py tools/opencode_global.py hooks/shoal_autoroute_gate.py install/install.py install/probe_hybrid_runtime.py install/validate_agents.py install/verify_dispatch.py install/validate_prompt_lock.py

      # Renewal 綠燈路徑：只有 PR 帶 label lock-renewal，或 push 到 main 的 head
      # commit message 含一行 "Lock-Renewal: approved"，才放寬 LOCK.json 的變動。
      # surface 的一次性 migration 只能走 push 路徑；PR label 路徑帶
      # --no-migration，遇到會生效的 migration 標記直接失敗。
      # commit message 是不可信輸入，只經環境變數傳入，不插進指令字串。
      - name: Enforce prompt document lock
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
        shell: bash
        env:
          PROMPT_LOCK_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HAS_RENEWAL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'lock-renewal') }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          flags=()
          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${PR_HAS_RENEWAL_LABEL}" = "true" ]; then
            flags+=(--allow-lock-update --no-migration)
          elif [ "${EVENT_NAME}" = "push" ] && printf '%s\n' "${HEAD_COMMIT_MESSAGE}" | tr -d '\r' | grep -qx 'Lock-Renewal: approved'; then
            flags+=(--allow-lock-update)
          fi
          python install/validate_prompt_lock.py --base-ref "${PROMPT_LOCK_BASE}" ${flags[@]+"${flags[@]}"}

      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: bash -n install/install.sh

      - name: Check PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./install/install.ps1 --help

      - name: Validate packaged configuration
        run: python install/validate_agents.py
