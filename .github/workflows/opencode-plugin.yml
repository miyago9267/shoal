name: OpenCode plugin tests

on:
  pull_request:
    paths:
      - "hosts/opencode/**"
      - "tests/fixtures/guard_vectors.json"
      - "tests/fixtures/shell_write_cases.json"
      - "tests/fixtures/opencode_guard_event_shapes.json"
      - "core/**"
      - "prompts/**"
      - ".github/workflows/opencode-plugin.yml"
  push:
    branches:
      - main
    paths:
      - "hosts/opencode/**"
      - "tests/fixtures/guard_vectors.json"
      - "tests/fixtures/shell_write_cases.json"
      - "tests/fixtures/opencode_guard_event_shapes.json"
      - "core/**"
      - "prompts/**"
      - ".github/workflows/opencode-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode-plugin:
    name: OpenCode plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: hosts/opencode/plugin
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Typecheck
        run: bun run typecheck
