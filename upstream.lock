# 記錄各 host 對應的上游與版本（spec R6）。
# 同步上游只透過人工 diff review，不自動更新。
# kind: vendored = 上游文字逐字放進 hosts/<host>/src/
#       derived = 原本是 vendored，agents/ 的 role 文字已改由 core 條款產生
#                 （不再逐字等於上游），agents/ 以外的檔案仍逐字取自上游
#       fork-base = 由上游 fork 出來，policy 已分岔，此為 fork 的基準版本
#       compare-base = 目前對照追到的上游版本，內容已自行演進

[grok]
kind = "derived"
upstream = "Nanako0129/pilotfish-grok"
version = "v1.0.6"
source = "dotfile plugins/pilotfish-grok/templates @ b65a243（agents/ 於 2b-2 改由 core 條款產生；rules/pilotfish-grok.md 逐字取自上游 v1.0.6，只有 marker 由 hosts/grok/VERSION 產生；hooks/ 為 shoal 自有，由 tools/install_grok.py 安裝）"
path = "hosts/grok/src"
marker_version = "2.0.0"  # <!-- shoal-grok v... --> 的版本；等於 hosts/grok/VERSION（2.0.0 起不再沿用上游版本號）

[claude]
kind = "fork-base"
upstream = "Nanako0129/pilotfish"
version = "v1.4.2"
source = "pilotfish-claude 1ea9841 templates（1.4.2-claude.1，另移植 codex 1.8.1 的 7 段規則）"
path = "hosts/claude/src"
marker_version = "2.1.0"  # <!-- shoal-claude v... --> 的版本（R8）；等於 hosts/claude/VERSION

[codex]
kind = "compare-base"
upstream = "Nanako0129/pilotfish"
version = "v1.3.0"
source = "pilotfish-codex 61a411b templates（本 repo 為 1.8.1，上游對照停在 v1.3.0，2026-07-22）"
path = "hosts/codex/src"

[agy]
kind = "fork-base"
upstream = "Nanako0129/pilotfish-grok"
version = "v1.0.6"
source = "dotfile plugins/pilotfish-agy/templates @ b65a243（改寫自 pilotfish-grok，原本沒有版本號）"
path = "hosts/agy/src"
marker_version = "2.0.0"  # <!-- shoal-agy v... --> 的版本（R8）；等於 hosts/agy/VERSION
