# Codex host binding：可用模型、存取等級對應的 sandbox、每個 role 的 effort；role description 在 prompts/hosts/codex/descriptions.md。
# 數值等於 shoal-codex 61a411b 的 templates/ 現況；templates/ 就是 codex 的 dist。

# role 文字來源：legacy = src 內的原文；core = prompts/roles 的條款加 prompts/hosts/<host>/ 的 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
# core 條款就是由 Codex 1.8.1 的原文切出，Codex 的 addenda 放回 Codex 專屬的句子，
# 所以 templates/agents/*.toml 與切換前的 legacy 逐位元組相同（core role 的 src/agents 原文已刪除）。
# host 專屬的 sol-executor 沒有 core 條款，一律沿用 src/agents/sol-executor.md。
role_text = "core"

# policy 文字來源（core-policy P4）：legacy = src 內的原文；core = prompts/policy 的條款加 prompts/hosts/<host>/ 的 policy-frames/、policy-addenda/。
# omit 列出該 host 省略的條款（[{id, reason}]，required 條款不可省略）；目前所有 host 都是 legacy。
[policy]
policy_text = "core"
omit = [
  { id = "bootstrap-effort", reason = "Codex does not let the caller set a child's reasoning effort" },
  { id = "effort-per-delegation", reason = "Codex does not let the caller set a child's reasoning effort" },
  { id = "bootstrap-kind-label", reason = "Codex `task_name` must match [a-z0-9_]+ and its values are reserved by the autoroute gate" },
  { id = "dispatch-kind-label", reason = "Codex `task_name` must match [a-z0-9_]+ and its values are reserved by the autoroute gate" },
  { id = "parallel-writers", reason = "Codex spawn_agent has no worktree isolation option" },
  { id = "discovery-scope-exclusive", reason = "Codex has no known read-tool names to name in the mixed-command check" },
  { id = "skill-intro", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "skill-bootstrap-authority", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "first-move-heading", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "first-move-steps", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "executor-brief-bound", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "references-heading", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "references-intro", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "reference-policy", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "reference-extensions", reason = "Codex plugin SKILL.md is hand-maintained" },
  { id = "reference-fail-soft", reason = "Codex plugin SKILL.md is hand-maintained" },
]

[policy.placeholders]
dispatch_tool = "spawn_agent"
question_tool = "request_user_input"
named_roles = "`scout`, `plan-critic`, `security-reviewer`, `applier`, `executor`, `verifier`, `security-executor`, `watcher`, `researcher`, `sol-executor`"
shell_tool = "Bash"
write_tools = "apply_patch"
# 無證據：Codex 的讀檔工具名在 repo 內找不到；唯一使用它的 discovery-scope-exclusive 已省略。
read_tools = "Bash"
background_option = "without waiting (`wait_agent` collects later)"
# 無證據：Codex spawn_agent 沒有 worktree 參數；唯一使用它的 parallel-writers 已省略，值只為滿足詞彙完整性。
worktree_option = "not available in Codex"
model_param = "model"
# effort_param、label_param 的條款已省略，值只為滿足詞彙完整性。
effort_param = "reasoning_effort"
label_param = "task_name"
goal_command = "/goal"
skill_term = "Skill"
policy_doc = "orchestration-policy.md"
extensions_doc = "workflow-extensions.md"
references_dir = "references/"

# core 文件 -> 輸出路徑（相對 dist = templates/）；extensions 另外鏡像到 plugin reference。
[policy.documents]
bootstrap = "agents-md.bootstrap.md"
skill = "skills/shoal-orchestration/SKILL.md"
orchestration = "agents-md.orchestration.md"
extensions = "agents-md.extensions.md"

[policy.mirrors]
"agents-md.extensions.md" = "plugins/codex/skills/shoal-orchestration/references/workflow-extensions.md"

# 這個 host 可用的模型與其名稱；resolver 只在這裡選（規則見 core/tiers.toml）。
[models]
"openai/gpt-6-luna" = "gpt-6-luna"
"openai/gpt-6-astra" = "gpt-6-astra"
"openai/gpt-6-sol" = "gpt-6-sol"

# config.snippet.toml 的 root model 與 effort；model 由 tier 解析（寫 model 則為手動指定）。
[root]
tier = "fast"
model_reasoning_effort = "max"
plan_mode_reasoning_effort = "xhigh"

# 存取等級 -> sandbox_mode；write 不輸出 sandbox_mode（沿用 Codex 預設）。
# role 要例外時才在 [roles.<name>] 寫 sandbox_mode / web_search 覆寫；覆寫不能讓 read-only role 變可寫，
# 也不能讓非 read-only role 變 read-only。
[access.read-only]
sandbox_mode = "read-only"

[access.write]

[access.verify]
sandbox_mode = "workspace-write"

[capabilities.web]
web_search = "live"

[roles.scout]
effort = "low"

[roles.applier]
effort = "medium"

[roles.executor]
effort = "high"

[roles.plan-critic]
effort = "high"

[roles.verifier]
effort = "high"

[roles.security-reviewer]
effort = "high"

[roles.security-executor]
effort = "high"

# watcher、researcher 是 delegation-default 新增的 core role；其他 host 也只接 role，不接派工條款與 guard 規則（spec D17）。
[roles.watcher]
effort = "low"

[roles.researcher]
effort = "high"

# codex 專屬 role，不屬於 core；model 明確指定，不經 tier。
[extra_roles.sol-executor]
model = "gpt-6-sol"
access = "write"
effort = "high"
