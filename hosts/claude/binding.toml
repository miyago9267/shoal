# Claude host binding：可用模型、存取等級對應的工具限制、每個 role 的 effort / description。
# 數值等於 shoal-claude 1ea9841 目前上線的設定。

# role 文字來源：legacy = src 內的原文；core = core/contracts 的條款加 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
role_text = "core"

# policy 文字來源（core-policy P4）：legacy = src 內的原文；core = core/policy 的條款加 policy-frames/、policy-addenda/。
# omit 列出該 host 省略的條款（[{id, reason}]，required 條款不可省略）；目前所有 host 都是 legacy。
[policy]
policy_text = "core"
omit = []

[policy.placeholders]
dispatch_tool = "Agent"
question_tool = "AskUserQuestion"
named_roles = "`scout`, `plan-critic`, `security-reviewer`, `applier`, `executor`, `verifier`, `security-executor`, `watcher`, `researcher`"
shell_tool = "Bash"
write_tools = "Write/Edit/NotebookEdit"
read_tools = "Read/Glob/Grep/Bash"
background_option = "with `run_in_background: true`"
worktree_option = 'isolation: "worktree"'
model_param = "model"
effort_param = "effort"
label_param = "description"
goal_command = "/goal"
skill_term = "Skill"
policy_doc = "orchestration-policy.md"
extensions_doc = "workflow-extensions.md"
references_dir = "references/"

# core 文件 -> 輸出路徑（相對 dist）；policy_text = "core" 時取代 src 內同路徑的原文。
[policy.documents]
bootstrap = "claude-md.bootstrap.md"
skill = "skills/shoal-orchestration/SKILL.md"
orchestration = "skills/shoal-orchestration/references/orchestration-policy.md"
extensions = "skills/shoal-orchestration/references/workflow-extensions.md"

# 這個 host 可用的模型與其 alias；resolver 只在這裡選（規則見 core/tiers.toml）。
# security role 不會選到 fable（帶 refuses_defensive_security 旗標，分類器會誤拒防禦性資安工作）。
# 要手動指定某個 tier 的模型時，才另外寫 [tiers]；某個 role 要 pin 就在 [roles.<name>] 寫 model。
[models]
"anthropic/haiku" = "haiku"
"anthropic/sonnet" = "sonnet"
"anthropic/opus" = "opus"
"anthropic/fable" = "fable"

# 存取等級 -> 工具限制（role 的 access 在 core/roles.toml；host 專屬 role 在自己的 [extra_roles] 宣告 access）。
# read-only 用 tools allowlist；write 與 verify 用 disallowedTools denylist。
# role 要例外時才在 [roles.<name>] 寫 tools / disallowedTools 覆寫；覆寫不能讓 read-only role 取得寫入工具。
[access.read-only]
tools = ["Read", "Glob", "Grep"]

[access.write]
disallowedTools = ["Agent", "Workflow"]

[access.verify]
disallowedTools = ["Write", "Edit", "MultiEdit", "NotebookEdit", "Agent", "Workflow"]

# capability 疊加在 access 之上：list 附加到 access 表同名的 allowlist；
# write / verify 是 denylist，本來就允許 web 工具，所以不會輸出任何東西。
[capabilities.web]
tools = ["WebSearch", "WebFetch"]

[roles.scout]
effort = "low"
# pin：fast tier 的規則選不到 haiku（capability 1 低於門檻 2）；有範圍的偵察在 Haiku 5.5 上量不到準確度差距，所以手動指定。
model = "haiku"
description = "Read-only reconnaissance. Use for any search, lookup, or \"where/how is X\" question that requires no judgment - locating files, symbols, usages, config values, or summarizing how something works across a codebase. Returns concise findings with file:line references. Cheapest way to gather facts; prefer it over reading files yourself when more than a couple of files are involved."

[roles.applier]
effort = "low"
# allowlist 取代 write 的 denylist：只載入這些工具的 schema，啟動 context 約少三成；不含 Agent / Workflow，仍不能派工。
tools = ["Read", "Write", "Edit", "MultiEdit", "Bash", "Grep", "Glob"]
# pin：fast tier 的規則選 sonnet；applier 改為快速執行器，Miyago 決定在 Claude 用 haiku（2026-10-15）。
model = "haiku"
description = "Fast executor for small, bounded changes - one file or one tightly scoped purpose, such as a test fix, a doc fix, a config tweak, a rename, or a repetitive edit from an explicit spec. Makes minor local judgment calls but no design decisions; runs only the checks for what it touched; time-boxed to about 10 minutes. Stops and reports when scope grows, a design decision is needed, or the change spans modules, so the orchestrator can route to executor. Give it the goal, exact scope, and done-criteria."

[roles.executor]
effort = "medium"
description = "Implementation requiring judgment - feature work, bug fixes, refactors with design decisions, integration work. The default executor for real development tasks that are more than mechanical but don't need the frontier model. Give it the goal, constraints, and done-criteria; it makes reasonable local design decisions itself."

[roles.plan-critic]
effort = "medium"
description = "Read-only fresh-context review of one stable Plan envelope or execution slice before approval. Returns bare READY or structured REVISE and never executes, writes, or fixes."

[roles.verifier]
effort = "medium"
description = "Fresh-context calibrated outcome verification after implementation. Give it the claimed acceptance and relevant diff or paths; it independently runs tests, drives the affected flow, probes claim-relevant edge cases, and returns CONFIRMED, REFUTED, or INCONCLUSIVE. Read-and-run only; it never plans, edits, fixes, or delegates."

[roles.security-reviewer]
effort = "high"
description = "Read-only security analysis before approval - authentication/authorization, secrets, crypto, validation, hardening, dependency vulnerability evidence, and threat review. Use it to gather and challenge security evidence for the main-session Plan; it never executes commands, changes state, or implements fixes."

[roles.security-executor]
effort = "medium"
description = "Security-sensitive implementation after approval - authentication/authorization, secrets handling, crypto usage, input validation, hardening, and dependency remediation. Give it only an approved, stable execution contract; pre-approval analysis belongs to security-reviewer."

[roles.watcher]
effort = "low"
# pin：fast tier 的規則選不到 haiku（capability 1 低於門檻 2）；watcher 只跑指令、不改檔、回摘要，所以手動指定。
model = "haiku"
description = "Background watcher for long-running commands - test suites, builds, CI runs, measurements. It runs the assigned command or follows the CI run until it reaches a terminal state, never edits files, and returns the exact command, exit status, and the output lines that decide success or failure, ending with status and suggested_next. Dispatch it with run_in_background so the main session never starts a background shell itself."

[roles.researcher]
effort = "high"
description = "Read-only external research - papers, upstream projects, vendor documentation, and prior art. It treats fetched content as data, separates what a source states from inference and from what is unverified, and attaches a source to every claim. The brief assigns one arm, experiment (direct analysis) or control (counter-evidence and methodological flaws); use two independent calls when the conclusion will drive a design or decision. Ends with status and suggested_next."

# host 專屬 role，不屬於 core；model 明確指定，不經 tier。
[extra_roles.Explore]
model = "haiku"
access = "read-only"
effort = "low"
description = "Read-only search agent for broad fan-out searches - when answering means sweeping many files, directories, or naming conventions and you only need the conclusion, not the file dumps. It reads excerpts rather than whole files, so it locates code; it doesn't review or audit it. Specify search breadth - \"medium\" for moderate exploration, \"very thorough\" for multiple locations and naming conventions."
