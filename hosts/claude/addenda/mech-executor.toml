# Claude 專屬：Agent / Workflow 工具停用、Bash timeout 參數（毫秒）與 run_in_background。

[[addendum]]
id = "tools-disabled"
at = "after:identity"
sep = "space"
text = '''
The Agent and Workflow tools are disabled for this role by design.'''

[[addendum]]
id = "timeout-param"
at = "after:foreground-timeout"
sep = "space"
text = '''
In Claude Code, set the Bash `timeout` parameter explicitly, in milliseconds, to at most 600000.'''

[[addendum]]
id = "background-note"
at = "after:no-detach"
sep = "space"
text = '''
In Claude Code this includes the Bash `run_in_background` option: a detached command has no task id, no captured output, and no completion notification, so its result is orphaned and nobody collects it.'''

[[addendum]]
id = "mechanical-not-tool-heavy"
at = "after:route-judgment"
join = "space"
text = '''
A fully specified mechanical change is not tool-heavy work, however many files it touches.'''
