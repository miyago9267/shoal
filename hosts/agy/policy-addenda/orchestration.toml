# agy 專屬與待共用的 policy 補充（對照表：docs/specs/core-policy/equivalence/agy.md §1、§2）。
# agy-* 是 agy 的調校（S07、S09、S35、S36）；pending-shared-* 是 core 沒有對應、等待收進 core 的通用規則
# （§2 第 1-7 項）。行為變更的列（R02、R12、R14、R16、S11、S23、S25、S29、S38、S48）不補回，以 core 為準。
# parallel-writers 在 agy 被 omit，所以並行寫入的 agy 規則掛在 parallel-launch。

[[addendum]]
id = "agy-plan-mode"
at = "after:approval-gate"
sep = "newline"
text = '''
- If Miyago has switched agy into `/plan` mode, stay there until approval.'''

[[addendum]]
id = "pending-shared-auto-approved-permissions"
at = "after:approval-gate"
sep = "newline"
text = '''
- Auto-approved tool permissions are not Plan approval.'''

[[addendum]]
id = "agy-readiness-brief"
at = "after:plan-gate"
sep = "newline"
text = '''
- Brief `plan-critic` with a `## Target readiness unit` block (`- ID:`,
  `- Kind:` `program envelope` or `execution slice`), the full Plan text, and
  evidence paths.'''

[[addendum]]
id = "pending-shared-security-proportionate"
at = "before:security-sensitive-routing"
sep = "newline"
text = '''
- Keep security basic and proportionate; the goal is to avoid tunnel vision, not
  to shrink execution capability.'''

[[addendum]]
id = "pending-shared-tell-plan-critic"
at = "after:security-reviewer-first"
sep = "space"
text = '''
Tell `plan-critic` you did so.'''

[[addendum]]
id = "pending-shared-brief-adjacent"
at = "after:security-reviewer-first"
sep = "space"
text = '''
Brief `security-reviewer` to look at adjacent entry points and side effects, not
  only the named boundary.'''

[[addendum]]
id = "pending-shared-security-executor-failure"
at = "after:security-executor-after-approval"
sep = "space"
text = '''
If it fails twice, re-scope or ask Miyago; do not quietly take the slice over.'''

[[addendum]]
id = "pending-shared-near-security"
at = "after:security-no-preapproval-write"
sep = "newline"
text = '''
- Ordinary work that merely sits near a security surface does not need this
  track; use `executor` and have `verifier` probe the obvious abuse case.'''

[[addendum]]
id = "pending-shared-brief-format"
at = "after:one-shot-spec"
join = "space"
sep = "newline"
text = '''
Also state the output format and verification expectation in the brief.'''

[[addendum]]
id = "agy-concurrent-entries"
at = "after:parallel-launch"
sep = "newline"
text = '''
- `invoke_subagent` accepts several entries to run concurrently.'''

[[addendum]]
id = "agy-workspace-isolation"
at = "after:parallel-launch"
sep = "newline"
text = '''
- Give writing workers exclusive files, or workspace mode `branch` / `share` for
  isolation; read-only workers use `inherit`.'''
