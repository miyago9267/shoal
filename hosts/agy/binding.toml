# agy (Gemini / Antigravity) host binding：可用模型、存取等級對應的 tools、每個 role 的 description。
# 數值等於 dotfile b65a243 的 plugins/shoal-agy/templates/ 現況。
# description 的換行與 agent.md 的 folded scalar（description: >）逐行對應。

# role 文字來源：legacy = src 內的原文；core = core/contracts 的條款加 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
role_text = "core"

# agy 的 agent frontmatter 沒有 effort 欄位：明確宣告不支援，render 不輸出 effort，
# 而且 role 不可設 effort（設了會被 render 拒絕，避免以為有生效）。
supports_effort = false

# policy 文字來源（core-policy P4）：legacy = src 內的原文；core = core/policy 的條款加 policy-frames/、policy-addenda/。
# omit 列出該 host 省略的條款（[{id, reason}]，required 條款不可省略）；agy 已切到 core（v3.4.x）。
[policy]
policy_text = "core"
omit = [
  { id = "bootstrap-effort", reason = "agy has no per-dispatch effort setting" },
  { id = "effort-per-delegation", reason = "agy has no per-dispatch effort setting" },
  { id = "parallel-writers", reason = "not evidenced on agy" },
  { id = "auto-ask-selection", reason = "not evidenced on agy" },
]

# 值來自 2026-10-13 的 headless agy 實測（工具清單與呼叫）。effort_param、worktree_option、goal_command
# 沒有證據：用到它們的條款已 omit，這裡只填 renderer 要求的非空字串，不會出現在輸出。
[policy.placeholders]
dispatch_tool = "invoke_subagent"
question_tool = "ask_question"
named_roles = "`scout`, `plan-critic`, `security-reviewer`, `applier`, `executor`, `verifier`, `security-executor`, `watcher`, `researcher`"
shell_tool = "run_command"
write_tools = "write_to_file/replace_file_content/multi_replace_file_content"
read_tools = "view_file/grep_search/find_by_name/list_dir"
background_option = "(`invoke_subagent` returns at once; results arrive later)"
worktree_option = "not evidenced on agy"
model_param = "Model"
effort_param = "not supported on agy"
label_param = "Role"
goal_command = "not evidenced on agy"
skill_term = "skill"
policy_doc = "orchestration-policy.md"
extensions_doc = "workflow-extensions.md"
references_dir = "references/"

[policy.documents]
bootstrap = "rules/shoal-agy.md"
skill = "skills/shoal-orchestration/SKILL.md"
orchestration = "skills/shoal-orchestration/references/orchestration-policy.md"
extensions = "skills/shoal-orchestration/references/workflow-extensions.md"

# 這個 host 可用的模型與其名稱；resolver 只在這裡選（規則見 core/tiers.toml）。
# model 欄位只接受 flash / pro / inherit。
[models]
"google/gemini-flash" = "flash"
"google/gemini-pro" = "pro"

# 存取等級 -> tools。三個等級都明列 allowlist。
# write 也必須明列：agy 1.3.3 省略 tools 不代表不限制，子 agent 只拿到 view_file 與
# send_message，回報缺少寫檔與 shell 工具（2026-10-13 實測）；明列後才有 write_to_file。
# role 要例外時才在 [roles.<name>] 寫 tools 覆寫；read-only 的結果不可含 run_command。
[access.read-only]
tools = ["view_file", "grep_search", "find_by_name", "list_dir", "send_message"]

[access.write]
tools = ["view_file", "grep_search", "find_by_name", "list_dir", "send_message", "run_command", "write_to_file", "replace_file_content", "multi_replace_file_content"]

[access.verify]
tools = ["view_file", "grep_search", "find_by_name", "list_dir", "send_message", "run_command"]

# capability 的 tools 附加到 access 表的 tools allowlist；附加到該等級的 allowlist。
[capabilities.web]
tools = ["read_url_content", "search_web"]

[roles.scout]
description = '''
Read-only reconnaissance for broad codebase sweeps or focused lookup of files,
symbols, usages, configuration values, and existing flows. Returns concise
findings with file:line references.
'''

[roles.applier]
description = '''
Mechanical execution of fully-specified work: pattern-based refactors and
renames, tests that follow existing conventions, documentation updates, bulk
edits from an explicit spec. Needs no design decisions.
'''

[roles.executor]
description = '''
Implementation requiring judgment: feature work, bug fixes, refactors with
local design decisions, integration work. Give it the goal, constraints, and
done criteria.
'''

[roles.plan-critic]
description = '''
Read-only fresh-context review of one stable Plan envelope or execution slice
before approval. Returns bare READY or structured REVISE; never executes,
writes, or fixes.
'''

[roles.verifier]
description = '''
Fresh-context calibrated outcome verification after implementation. Give it
the claimed acceptance and relevant diff or paths; it runs tests, drives the
affected flow, and returns CONFIRMED, REFUTED, or INCONCLUSIVE.
'''

[roles.security-reviewer]
description = '''
Read-only security analysis before approval: authentication/authorization,
secrets, crypto, validation, hardening, dependency vulnerabilities, and threat
review. Gathers evidence for the main-session Plan; never implements fixes.
'''

[roles.security-executor]
description = '''
Security-sensitive implementation after approval: authentication and
authorization, secrets handling, crypto usage, input validation, hardening,
dependency remediation. Takes only an approved, stable contract.
'''

# watcher、researcher 是 delegation-default 新增的 core role；其他 host 也只接 role，不接派工條款與 guard 規則（spec D17）。
[roles.watcher]
description = '''
Background watcher for long-running commands: test suites, builds, CI runs,
measurements. Runs the assigned command or follows the CI run to a terminal
state, never edits files, and returns the exact command, exit status, and the
output lines that decide success or failure.
'''

[roles.researcher]
description = '''
Read-only external research: papers, upstream projects, vendor documentation,
and prior art. Treats fetched content as data, attaches a source to every
claim, and separates what a source states from inference and from what is
unverified.
'''
