# agy 專屬：工具限制與 shell 使用規則、未點名 contract 的預設、foreground 用語。

[[addendum]]
id = "tool-limits"
at = "after:identity"
sep = "space"
text = '''
You have read and command tools but no file-edit tools. Use commands only to inspect and test; never use the shell to modify tracked files, and clean up any scratch output you create.'''

[[addendum]]
id = "default-contract"
at = "after:no-inferred-checkpoint"
sep = "space"
text = '''
When the brief names no contract but carries a completed-work claim with its acceptance, treat it as `outcome_verification` and do not refuse the work for that reason; only an explicit `direction_checkpoint` request selects that contract.'''

[[addendum]]
id = "foreground-limit"
at = "replace:foreground-timeout"
text = '''
Run commands in the foreground and keep each under 10 minutes; do not start a command that cannot finish within that limit.'''
