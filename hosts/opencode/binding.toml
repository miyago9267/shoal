# OpenCode host binding：可用的 provider/model、每個 role 的 fallback 與必要能力，
# 以及 catalog.json 的 provider 清單。render 產生 dist/catalog.json 與 dist/routing.json。
# 數值等於 dotfile b65a243 的 .opencode/pilotfish/{catalog,routing}.json 現況。
# pi-routing.json 由 dotfile 擁有，不在這裡產生。

# role 文字來源：legacy = src 內的原文；core = core/contracts 的條款加 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
role_text = "legacy"

# OpenCode 沒有 mech-executor、plan-verifier；這兩個 role 不產生 agent，也不進 routing。
omitted_roles = ["mech-executor", "plan-verifier"]

[routing]
version = 1

# 這個 host 的第一順位 candidate 只在這裡選（規則見 core/tiers.toml），值是 {provider, model}。
# fallback 用的 gemini-2.5-flash、grok-4.6 只出現在 per-role 的 fallback_candidates，不納入 resolver。
[models]
"deepseek/deepseek-v4-flash" = { provider = "deepseek", model = "deepseek-v4-flash" }
"openai/gpt-5.6-luna" = { provider = "openai", model = "gpt-5.6-luna" }
"openai/gpt-5.6-sol" = { provider = "openai", model = "gpt-5.6-sol" }

# 存取等級 -> required_capabilities（candidate 在 [providers] 內必須支援的能力）。
# 這是模型能力需求，不是權限；read-only 的 scout（fast）只要 tools 與 streaming，
# security-reviewer 要 reasoning，所以後者在 [roles.security-reviewer] 保留覆寫。
[access.read-only]
required_capabilities = ["tools", "streaming"]

[access.write]
required_capabilities = ["tools", "streaming", "reasoning"]

[access.verify]
required_capabilities = ["tools", "streaming", "reasoning"]

# OpenCode 沒有獨立的 web 權限：宣告 capability 已知，但不輸出任何欄位。
[capabilities.web]

# fallback：none / ordered_candidates / same_capability；fallback_candidates 接在第一順位之後。
[roles.scout]
fallback = "ordered_candidates"
fallback_candidates = [{ provider = "google", model = "gemini-2.5-flash" }]

[roles.executor]
fallback = "same_capability"
fallback_candidates = [{ provider = "xai", model = "grok-4.6" }]

[roles.verifier]
fallback = "same_capability"
fallback_candidates = [{ provider = "xai", model = "grok-4.6" }]

[roles.security-reviewer]
fallback = "none"
fallback_candidates = []
required_capabilities = ["tools", "streaming", "reasoning"]

[roles.security-executor]
fallback = "same_capability"
fallback_candidates = [{ provider = "openai", model = "gpt-5.6-luna" }]

# catalog.json 的 providers；key 順序即輸出順序。
[providers.deepseek]
authenticated = true
identity = "direct"
[providers.deepseek.models."deepseek-v4-flash"]
supported = ["tools", "streaming", "reasoning"]
source = "catalog"

[providers.google]
authenticated = true
identity = "direct"
[providers.google.models."gemini-2.5-flash"]
supported = ["tools", "streaming"]
source = "catalog"

[providers.openai]
authenticated = true
identity = "direct"
[providers.openai.models."gpt-5.6-luna"]
supported = ["tools", "streaming", "reasoning"]
source = "catalog"
[providers.openai.models."gpt-5.6-sol"]
supported = ["tools", "streaming", "reasoning"]
source = "catalog"

[providers.xai]
authenticated = true
identity = "direct"
[providers.xai.models."grok-4.6"]
supported = ["tools", "streaming", "reasoning"]
source = "catalog"
