# grok host binding：存取等級對應的 capability mode、每個 role 的 roles/*.toml（description、reasoning effort）。
# 數值等於 dotfile b65a243 的 plugins/shoal-grok/templates/roles/（vendored 自
# Nanako0129/pilotfish-grok v1.0.6，見 upstream.lock）。
# config.snippet.toml 逐字放在 src/，不經 render 改寫。agents/*.md 在 core 模式由
# frames/（frontmatter、含 model: inherit）、core 條款與 addenda/ 產生；src/agents/
# 是 legacy 原文，只在 role_text = "legacy" 時使用。

# role 文字來源：legacy = src 內的原文；core = core/contracts 的條款加 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
role_text = "core"

# 所有 agent 的 frontmatter 都是 model: inherit；effort 寫在 roles/*.toml 的 reasoning_effort。
# 不指定模型：resolver 不介入，每個 role 都解析成 inherit。
# render 會驗證 src/agents/<role>.md 的 model 等於解析出的值。
selection = "inherit"

# policy 文字來源（core-policy P4）：legacy = src 內的原文；core = core/policy 的條款加 policy-frames/、policy-addenda/。
# omit 列出該 host 省略的條款（[{id, reason}]，required 條款不可省略）；目前所有 host 都是 legacy。
[policy]
policy_text = "legacy"
omit = []

# 存取等級 -> default_capability_mode。read-only role 必須（且只有 read-only role）是 "read-only"。
[access.read-only]
capability_mode = "read-only"

[access.write]
capability_mode = "all"

[access.verify]
capability_mode = "execute"

# grok 沒有獨立的 web 權限開關：宣告 capability 已知，但不輸出任何欄位。
[capabilities.web]

[roles.scout]
comment = "Role defaults applied when spawning subagent_type \"scout\"."
effort = "low"
description = "Read-only reconnaissance for broad codebase sweeps or focused lookup"

[roles.mech-executor]
effort = "low"
description = "Mechanical implementation from a complete specification"

[roles.executor]
effort = "medium"
description = "Implementation requiring local engineering judgment"

[roles.plan-verifier]
effort = "medium"
description = "Read-only Plan readiness challenge before approval"

[roles.verifier]
effort = "medium"
description = "Fresh-context outcome verification (read and run, never edit)"

[roles.security-reviewer]
effort = "high"
description = "Read-only security evidence before approval"

[roles.security-executor]
effort = "high"
description = "Approved security-sensitive implementation"
