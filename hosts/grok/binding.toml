# grok host binding：存取等級對應的 capability mode、每個 role 的 roles/*.toml（reasoning effort；description 在 prompts/hosts/grok/descriptions.md）。
# 數值等於 dotfile b65a243 的 plugins/shoal-grok/templates/roles/（vendored 自
# Nanako0129/pilotfish-grok v1.0.6，見 upstream.lock）。
# config.snippet.toml 逐字放在 src/，不經 render 改寫。agents/*.md 在 core 模式由
# frames/（frontmatter、含 model: inherit）、core 條款與 addenda/ 產生；src/agents/
# 的 legacy 原文已刪除，core role 的 src 內不可有同名檔（render 會拒絕）。

# role 文字來源：legacy = src 內的原文；core = prompts/roles 的條款加 prompts/hosts/<host>/ 的 frames/、addenda/。
# 個別 role 要不同時，在 [roles.<name>] 寫 role_text 覆寫。
role_text = "core"

# 所有 agent 的 frontmatter 都是 model: inherit；effort 寫在 roles/*.toml 的 reasoning_effort。
# 不指定模型：resolver 不介入，每個 role 都解析成 inherit。
# render 會驗證 src/agents/<role>.md 的 model 等於解析出的值。
selection = "inherit"

# policy 文字來源（core-policy P4）：legacy = src 內的原文；core = prompts/policy 的條款加 prompts/hosts/<host>/ 的 policy-frames/、policy-addenda/。
# omit 列出該 host 省略的條款（[{id, reason}]，required 條款不可省略）；目前所有 host 都是 legacy。
[policy]
policy_text = "legacy"
omit = []

# 存取等級 -> default_capability_mode。read-only role 必須（且只有 read-only role）是 "read-only"。
[access.read-only]
capability_mode = "read-only"

[access.write]
capability_mode = "all"

[access.verify]
capability_mode = "execute"

# grok 沒有獨立的 web 權限開關：宣告 capability 已知，但不輸出任何欄位。
[capabilities.web]

[roles.scout]
comment = "Role defaults applied when spawning subagent_type \"scout\"."
effort = "low"

[roles.applier]
effort = "low"

[roles.executor]
effort = "medium"

[roles.plan-critic]
effort = "medium"

[roles.verifier]
effort = "medium"

[roles.security-reviewer]
effort = "high"

[roles.security-executor]
effort = "high"

# watcher、researcher 是 delegation-default 新增的 core role；其他 host 也只接 role，不接派工條款與 guard 規則（spec D17）。
[roles.watcher]
effort = "low"

[roles.researcher]
effort = "high"
