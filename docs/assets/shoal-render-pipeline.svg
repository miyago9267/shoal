<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">shoal render 流程</title>
  <desc id="desc">core 的 role 定義、共用條款與模型目錄，加上每個 host 的 binding，經 tools/render.py 選模、對應權限並組裝 role 文字，產生 Claude Code、Codex CLI、Gemini/agy、Grok Build、OpenCode 五個 host 的 dist，再由各自的方式安裝。</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="arrow"/></marker>
    <style>
      .bg { fill: #f7f9fc; } .fg { fill: #152238; } .muted { fill: #66758a; }
      .route { stroke: #9aaabd; fill: none; stroke-width: 2; }
      .blue { fill: #3f6fe5; } .purple { fill: #7954c6; } .amber { fill: #cf8427; } .green { fill: #26986d; }
      .soft-blue { fill: #eaf0ff; stroke: #b9cbfa; } .soft-purple { fill: #f1ecff; stroke: #d3c2f4; }
      .soft-amber { fill: #fff3e2; stroke: #efd2a5; } .soft-green { fill: #e7f7ef; stroke: #b8e3ce; }
      .kicker { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.8px; }
      .title { font: 600 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .section { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; }
      .label { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace; }
      .small { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tiny { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .arrow { fill: #9aaabd; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #101827; } .fg { fill: #f3f6fb; } .muted { fill: #a6b3c5; }
        .route { stroke: #708198; }
        .soft-blue { fill: #1b2d59; stroke: #4768af; } .soft-purple { fill: #302347; stroke: #6d55a2; }
        .soft-amber { fill: #49341d; stroke: #9d743f; } .soft-green { fill: #1b4233; stroke: #438f6d; }
        .arrow { fill: #708198; }
      }
    </style>
  </defs>

  <rect width="1400" height="800" class="bg"/>
  <text x="48" y="45" class="kicker muted">SHOAL / RENDER PIPELINE</text>
  <text x="48" y="88" class="title fg">一份 role 定義，render 成五個 host</text>
  <text x="48" y="120" class="small muted">只改 core 或 binding，五個 host 的 agent 設定一起更新；產物有 golden 測試，每個改動都看得到 diff。</text>

  <!-- column 1: core -->
  <text x="48" y="172" class="section purple">CORE（HOST 中立）</text>
  <rect x="48" y="190" width="340" height="120" rx="14" class="soft-purple"/>
  <text x="70" y="222" class="mono fg">core/roles.toml</text>
  <text x="70" y="250" class="small fg">7 個 role：存取等級、tier、資安屬性</text>
  <text x="70" y="276" class="tiny muted">scout · mech-executor · executor · plan-verifier</text>
  <text x="70" y="296" class="tiny muted">verifier · security-reviewer · security-executor</text>

  <rect x="48" y="330" width="340" height="100" rx="14" class="soft-purple"/>
  <text x="70" y="362" class="mono fg">core/contracts/</text>
  <text x="70" y="390" class="small fg">共用條款，逐字出現在每個 host</text>
  <text x="70" y="414" class="tiny muted">例：verifier 列隱含權衡、隱私檢查</text>

  <rect x="48" y="450" width="340" height="100" rx="14" class="soft-purple"/>
  <text x="70" y="482" class="mono fg">core/models.toml · tiers.toml</text>
  <text x="70" y="510" class="small fg">模型目錄的 capability 與 cost</text>
  <text x="70" y="534" class="tiny muted">tier 門檻：fast ≥ 2、standard ≥ 3、strong ≥ 4、frontier 取最強</text>

  <!-- column 2: binding + render -->
  <text x="470" y="172" class="section amber">HOST BINDING</text>
  <rect x="470" y="190" width="420" height="140" rx="14" class="soft-amber"/>
  <text x="492" y="222" class="mono fg">hosts/&lt;host&gt;/binding.toml</text>
  <text x="492" y="252" class="small fg">可用模型、選模方式（規則或 inherit）</text>
  <text x="492" y="280" class="small fg">存取等級 → 該 host 的權限欄位</text>
  <text x="492" y="308" class="small fg">addenda：host 專屬的補充條款</text>

  <rect x="470" y="380" width="420" height="190" rx="14" class="soft-blue"/>
  <text x="492" y="414" class="mono fg">tools/render.py</text>
  <circle cx="504" cy="444" r="12" class="blue"/><text x="499" y="449" class="tiny" fill="#fff">1</text>
  <text x="526" y="450" class="small fg">resolver 依 tier 從模型目錄選模</text>
  <circle cx="504" cy="478" r="12" class="blue"/><text x="499" y="483" class="tiny" fill="#fff">2</text>
  <text x="526" y="484" class="small fg">access 對應成 tools / sandbox / mode</text>
  <circle cx="504" cy="512" r="12" class="blue"/><text x="499" y="517" class="tiny" fill="#fff">3</text>
  <text x="526" y="518" class="small fg">共用條款 + addenda 組成 role 文字</text>
  <text x="492" y="552" class="tiny muted">--check 逐位元組比對 golden；prompt lock 守受保護的 surface</text>

  <path d="M388 250 C 430 250, 430 450, 466 452" class="route" marker-end="url(#arrow)"/>
  <path d="M388 380 C 425 380, 430 465, 466 466" class="route" marker-end="url(#arrow)"/>
  <path d="M388 500 C 425 500, 430 480, 466 480" class="route" marker-end="url(#arrow)"/>
  <path d="M680 330 L680 374" class="route" marker-end="url(#arrow)"/>

  <!-- column 3: hosts -->
  <text x="960" y="172" class="section green">DIST → 安裝</text>
  <g>
    <rect x="960" y="190" width="392" height="84" rx="14" class="soft-green"/>
    <text x="982" y="220" class="label fg">Claude Code</text>
    <text x="982" y="244" class="tiny fg">agents/*.md + orchestration skill</text>
    <text x="982" y="264" class="tiny muted">dotfile 每日 auto-update 安裝</text>

    <rect x="960" y="290" width="392" height="84" rx="14" class="soft-green"/>
    <text x="982" y="320" class="label fg">Codex CLI</text>
    <text x="982" y="344" class="tiny fg">templates/agents/*.toml + policy</text>
    <text x="982" y="364" class="tiny muted">install/install.sh</text>

    <rect x="960" y="390" width="392" height="84" rx="14" class="soft-green"/>
    <text x="982" y="420" class="label fg">Gemini / agy</text>
    <text x="982" y="444" class="tiny fg">agents/*/agent.md + rules + skill</text>
    <text x="982" y="464" class="tiny muted">~/.gemini 以 symlink 直接使用 dist</text>

    <rect x="960" y="490" width="392" height="84" rx="14" class="soft-green"/>
    <text x="982" y="520" class="label fg">Grok Build</text>
    <text x="982" y="544" class="tiny fg">agents + roles + rules + 原生 hooks</text>
    <text x="982" y="564" class="tiny muted">tools/install_grok.py --apply</text>

    <rect x="960" y="590" width="392" height="84" rx="14" class="soft-green"/>
    <text x="982" y="620" class="label fg">OpenCode</text>
    <text x="982" y="644" class="tiny fg">roles + catalog / routing.json + plugin</text>
    <text x="982" y="664" class="tiny muted">install.sh --global 或 --target DIR</text>
  </g>

  <path d="M890 475 C 925 475, 925 232, 956 232" class="route" marker-end="url(#arrow)"/>
  <path d="M890 475 C 925 475, 925 332, 956 332" class="route" marker-end="url(#arrow)"/>
  <path d="M890 475 C 925 475, 925 432, 956 432" class="route" marker-end="url(#arrow)"/>
  <path d="M890 475 C 925 475, 925 532, 956 532" class="route" marker-end="url(#arrow)"/>
  <path d="M890 475 C 925 475, 925 632, 956 632" class="route" marker-end="url(#arrow)"/>

  <rect x="48" y="710" width="1304" height="56" rx="14" class="soft-blue"/>
  <text x="72" y="744" class="small fg">新增 host：輸出格式是「每個 role 一個 Markdown 檔加 frontmatter」的工具，用 tools/new_host.py 產生骨架、填 binding 即可，不用寫程式碼。</text>
</svg>
