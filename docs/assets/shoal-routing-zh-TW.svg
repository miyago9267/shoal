<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" width="960" height="616" role="img" aria-labelledby="ttl dsc" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif'>
<title id="ttl">同一個角色，每個工具用最合適的模型</title>
<desc id="dsc">矩陣列出 scout、applier、executor、verifier、researcher、plan-critic 六個角色在五個工具上實際使用的模型。Claude Code：haiku、sonnet、sonnet、opus、opus、fable。Codex CLI：gpt-6-luna、gpt-6-luna、gpt-6-astra、gpt-6-sol、gpt-6-sol、gpt-6-sol。Gemini / agy：flash、flash、pro、pro、pro、pro。OpenCode：deepseek-v4-flash、deepseek-v4-flash、gpt-5.6-luna、gpt-5.6-sol、gpt-5.6-sol、gpt-5.6-sol。Grok Build 沿用你自己設定的主模型。</desc>
<style>
.bg{fill:#f7f9fc}.fg{fill:#152238}.muted{fill:#5b6b80}.ln{stroke:#c9d4e2;fill:none;stroke-width:1.5}
.card{fill:#fff;stroke:#c9d4e2;stroke-width:1.2}
.sb{fill:#eaf0ff;stroke:#a9bff5}.sg{fill:#e3f5ec;stroke:#a6dcc0}.sa{fill:#fff1dc;stroke:#ecc98d}.sp{fill:#efe9ff;stroke:#c9b8f1}.sr{fill:#fde8e8;stroke:#eeb0b0}.sx{fill:#eef1f5;stroke:#b4bfcd;stroke-dasharray:5 4}
.ar{stroke:#5b6b80;stroke-width:1.8;fill:none}.arh{fill:#5b6b80}
.t{font-weight:700;font-size:26px}.st{font-size:15px}.h{font-weight:700;font-size:16px}.b{font-size:15px}.sm{font-size:13px}.xs{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bold{font-weight:700}
@media (prefers-color-scheme: dark){
.bg{fill:#101827}.fg{fill:#f3f6fb}.muted{fill:#a9b6c8}.ln{stroke:#3a4a60}
.card{fill:#172235;stroke:#3a4a60}
.sb{fill:#1b2d59;stroke:#4f74c4}.sg{fill:#173d2e;stroke:#3f9470}.sa{fill:#473219;stroke:#a07a43}.sp{fill:#2d2247;stroke:#7059a8}.sr{fill:#4a2323;stroke:#a35a5a}.sx{fill:#1d2838;stroke:#5d6d82}
.ar{stroke:#a9b6c8}.arh{fill:#a9b6c8}}
</style>
<rect width="960" height="616" class="bg"/>
<text x="40" y="52" class="t fg" text-anchor="start">同一個角色，每個工具用最合適的模型</text>
<text x="40" y="80" class="st muted" text-anchor="start">查找和機械修改用便宜的，驗證與審查用強的</text>
<text x="48" y="140.0" class="b muted" text-anchor="start">角色</text>
<text x="272.0" y="140.0" class="h fg" text-anchor="middle">Claude Code</text>
