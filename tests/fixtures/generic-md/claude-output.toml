# 以 generic-md 的 [output] 宣告重現 Claude 的 agents/<role>.md（七個 role 都逐位元組相同）。
# effort 是 role 層級的欄位：role_fields 宣告後，用 role.effort 讀 [roles.<r>].effort。
[output]
path = "agents/{role}.md"
role_fields = ["effort"]

[[output.frontmatter]]
key = "name"
source = "name"
encoding = "scalar"

[[output.frontmatter]]
key = "description"
source = "description"
encoding = "scalar"

[[output.frontmatter]]
key = "model"
source = "model"
encoding = "scalar"

[[output.frontmatter]]
key = "effort"
source = "role.effort"
encoding = "scalar"

[[output.frontmatter]]
key = "tools"
source = "tools"
encoding = "comma-list"

[[output.frontmatter]]
key = "disallowedTools"
source = "disallowedTools"
encoding = "comma-list"

[output.permissions.tools]
type = "list"

[output.permissions.disallowedTools]
type = "list"
