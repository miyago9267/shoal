# 模型目錄：host 中立，key 是 "vendor/name"，不寫任何 host 專屬的名稱。
# 各 host 可用哪些模型、在該 host 叫什麼，寫在 hosts/<host>/binding.toml 的 [models]。
#
# capability、cost 都是 1-5 的相對級距（cost 不放實際價格），只在同一個 host 的
# 可用集合內比較。初版數值是校準到「能重現 2026-10 的現行配置」，不是客觀量測；
# 之後要用 benchmark 修正，必須走 golden diff review（見 docs/model-catalog.md）。
# flags：refuses_defensive_security 表示該模型的分類器會誤拒防禦性資安工作，
# security = true 的 role 不會選到它。

[models."anthropic/haiku"]
vendor = "anthropic"
capability = 1
cost = 1

[models."anthropic/sonnet"]
vendor = "anthropic"
capability = 3
cost = 2

[models."anthropic/opus"]
vendor = "anthropic"
capability = 4
cost = 4

[models."anthropic/fable"]
vendor = "anthropic"
capability = 5
cost = 5
flags = ["refuses_defensive_security"]

[models."openai/gpt-6-luna"]
vendor = "openai"
capability = 2
cost = 1

[models."openai/gpt-6-astra"]
vendor = "openai"
capability = 3
cost = 2

[models."openai/gpt-6-sol"]
vendor = "openai"
capability = 5
cost = 4

[models."openai/gpt-5.6-luna"]
vendor = "openai"
capability = 3
cost = 2

[models."openai/gpt-5.6-sol"]
vendor = "openai"
capability = 5
cost = 4

[models."deepseek/deepseek-v4-flash"]
vendor = "deepseek"
capability = 2
cost = 1

[models."google/gemini-flash"]
vendor = "google"
capability = 2
cost = 1

[models."google/gemini-pro"]
vendor = "google"
capability = 4
cost = 3
